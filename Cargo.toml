[package]
name = "nats-hub"
version = "0.1.0"
edition = "2021"
description = "NATS-based communication layer with control plane router for agent + human messaging"

[[bin]]
name = "hub-server"
path = "src/bin/hub_server.rs"

[[bin]]
name = "hub-publish"
path = "src/bin/hub_publish.rs"

[[bin]]
name = "hub-observe"
path = "src/bin/hub_observe.rs"

[[bin]]
name = "hub-interact"
path = "src/bin/hub_interact.rs"

[[bin]]
name = "hub-register"
path = "src/bin/hub_register.rs"

[dependencies]
async-nats = "0.38"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"