[package]
name = "nats-hub"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "NATS-based communication layer with control plane routing for agent + human messaging"
license = "BSL-1.1"
repository = "https://github.com/jarmen423/nats-hub"
readme = "README.md"
authors = ["Agent Memory Labs <josh@agentmemorylabs.com>"]
keywords = ["nats", "agent", "messaging", "communication", "surrealdb"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "nats_hub"
path = "src/lib.rs"

[[bin]]
name = "hub-server"
path = "src/bin/hub_server.rs"
required-features = ["storage-surreal"]

[[bin]]
name = "hub-publish"
path = "src/bin/hub_publish.rs"

[[bin]]
name = "hub-observe"
path = "src/bin/hub_observe.rs"

[[bin]]
name = "hub-interact"
path = "src/bin/hub_interact.rs"

[[bin]]
name = "hub-register"
path = "src/bin/hub_register.rs"

[[bin]]
name = "hub-agents"
path = "src/bin/hub_agents.rs"
required-features = ["storage-surreal"]

[[bin]]
name = "hub-worker"
path = "src/bin/hub_worker.rs"

[[bin]]
name = "hub-history"
path = "src/bin/hub_history.rs"
required-features = ["storage-surreal"]

[[bin]]
name = "hub-delegate"
path = "src/bin/hub_delegate.rs"

[[bin]]
name = "hub-session"
path = "src/bin/hub_session.rs"
required-features = ["storage-surreal"]

[[bin]]
name = "hub-watch"
path = "src/bin/hub_watch.rs"

[[bin]]
name = "hub-wave"
path = "src/bin/hub_wave.rs"
required-features = ["storage-surreal"]

[[bin]]
name = "hub-thread"
path = "src/bin/hub_thread.rs"
required-features = ["storage-surreal"]

[[bin]]
name = "hub-stats"
path = "src/bin/hub_stats.rs"
required-features = ["storage-surreal"]

[[bin]]
name = "hub-tui"
path = "src/bin/hub_tui.rs"
required-features = ["storage-surreal", "tui"]

[[bin]]
name = "hub-admin"
path = "src/bin/hub_admin.rs"

# ── Library dependencies (what downstream crates pull in) ──────
[dependencies]
async-nats = "0.38"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
async-trait = "0.1"
nkeys = "0.4"

# Binaries also need clap + tracing-subscriber (not needed by library consumers)
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ── WebSocket bridge (for visualizer) ──────────────────────────
tokio-tungstenite = "0.24"

# ── TUI dashboard (optional, feature = "tui") ─────────────────
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# ── Storage backends (enable via feature flag) ─────────────────
surrealdb = { version = "2", optional = true, features = ["kv-rocksdb", "kv-mem"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["storage-surreal"]
storage-surreal = ["dep:surrealdb"]
tui = ["dep:ratatui", "dep:crossterm"]
# No-storage mode: pure NATS transport, no persistence layer.
# Use this when embedding nats-hub as a messaging dependency
# without needing SurrealDB (e.g. ephemeral agents, testing).
no-storage = []

# ── Build profiles ─────────────────────────────────────────────
# Full debuginfo made every test/bin artifact ~0.8 GB (hub-server: 787 MB) and a
# debug build + tests ~20-40 GB per checkout. Keep file:line in backtraces for
# our code; drop debuginfo for dependencies. ~5-10x smaller, faster links.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

