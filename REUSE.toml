# Machine-readable license map for nats-hub (REUSE spec 3.x).
#
# The repo is licensed by path: client side Apache-2.0, server side BUSL-1.1.
# LICENSING.md explains the split in plain language; LICENSES/ holds the texts.
#
# Order matters: when several annotations match a file, the LAST one wins.
# All files default to Apache-2.0, including crates/client/**. The root
# nats-hub server crate (Cargo.toml and src/**) and server assets are BUSL-1.1.
# Narrow exceptions cover the client model catalog and third-party sprites.
# `precedence = "override"` makes this file authoritative even if a file
# happens to contain an SPDX tag of its own.
version = 1

# 1. Default: Apache-2.0.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Agent Memory Labs"
SPDX-License-Identifier = "Apache-2.0"

# 2. Server side: BUSL-1.1.
[[annotations]]
path = [
    "Cargo.toml",
    "src/**",
    "visualizer/**",
    "deploy/**",
    "config/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Agent Memory Labs"
SPDX-License-Identifier = "BUSL-1.1"

# 5a. Provider/model catalog read by the Python workers (client side).
[[annotations]]
path = "config/provider_models.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Agent Memory Labs"
SPDX-License-Identifier = "Apache-2.0"

# 5b. Vendored p5.js (visualizer): third-party, LGPL-2.1-or-later.
#     Pinned 1.11.3; checksum in visualizer/vendor/p5.VERSION.
[[annotations]]
path = "visualizer/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2014-2025 p5.js contributors and Lauren Lee McCarthy"
SPDX-License-Identifier = "LGPL-2.1-or-later"
