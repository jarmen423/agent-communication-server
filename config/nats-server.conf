# NATS server config for nats-hub communication layer
# Docs: https://docs.nats.io/running-a-nats-service/configuration

port: 4222
http_port: 8222   # monitoring endpoint

# WebSocket gateway — remote agents connect via ws://host:8080
# without needing the NATS server binary, just the client library.
# DEVELOPMENT DEFAULT: no_tls permits unencrypted ws:// connections. Keep this
# only on trusted development networks; use the commented production settings
# below before exposing the listener remotely.
websocket {
    port: 8080
    no_tls: true
    same_origin: false
    handshake_timeout: "5s"

    # PRODUCTION TLS (replace no_tls: true with these settings and uncomment):
    # cert_file: "/etc/nats/tls/nats-server.crt"  # PEM server certificate/full chain
    # key_file: "/etc/nats/tls/nats-server.key"  # PEM private key; restrict file permissions
}

# PRODUCTION AUTHENTICATION EXAMPLES — enable exactly one approach.
# A top-level token is the simplest shared-secret option. Prefer a secret from
# deployment configuration rather than committing a real token to this file.
# authorization {
#     token: "REPLACE_WITH_A_LONG_RANDOM_TOKEN"
# }
#
# For per-agent credentials, use users instead. The connection-type restriction
# prevents these credentials from being used on the ordinary TCP listener.
# Subject permissions should be narrowed for each agent; see REMOTE_AGENTS.md.
# authorization {
#     users: [
#         {
#             user: "remote-agent"
#             password: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
#             allowed_connection_types: ["WEBSOCKET"]
#         }
#     ]
# }

# Maximum connections
max_connections: 1000

# Maximum payload (default 1MB, bumped to 10MB for larger agent messages)
max_payload: 10485760

# Logging
log_file: "/tmp/nats-hub-server.log"
logtime: true
debug: false
trace: false

# Server identity
server_name: "nats-hub"