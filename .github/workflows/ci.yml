name: ci

on:
  push:
    branches: ["**"]   # every branch: task branches are verified by CI before a local merge
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (RocksDB build)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Setup (nats-server + venv)
        run: make setup

      - name: fmt
        run: cargo fmt --all -- --check

      - name: Build
        run: make build

      - name: Rust tests (isolated nats-server + hub-server)
        run: make test-rust

      - name: Python tests (isolated nats-server + hub-server)
        run: make test-py
