[package]
name = "nats-hub-client"
version = "0.0.1"
edition = "2021"
rust-version = "1.74"
description = "Apache-2.0 NATS messaging client, wire types, CLIs and TUI"
license = "Apache-2.0"
repository = "https://github.com/jarmen423/agent-communication-server"
readme = "../../README.md"
authors = ["Agent Memory Labs <josh@agentmemorylabs.com>"]
keywords = ["nats", "agent", "messaging", "communication"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "nats_hub_client"
path = "src/lib.rs"

[[bin]]
name = "hub-publish"
path = "src/bin/hub_publish.rs"

[[bin]]
name = "hub-observe"
path = "src/bin/hub_observe.rs"

[[bin]]
name = "hub-interact"
path = "src/bin/hub_interact.rs"

[[bin]]
name = "hub-register"
path = "src/bin/hub_register.rs"

[[bin]]
name = "hub-agents"
path = "src/bin/hub_agents.rs"

[[bin]]
name = "hub-worker"
path = "src/bin/hub_worker.rs"

[[bin]]
name = "hub-history"
path = "src/bin/hub_history.rs"

[[bin]]
name = "hub-delegate"
path = "src/bin/hub_delegate.rs"

[[bin]]
name = "hub-session"
path = "src/bin/hub_session.rs"

[[bin]]
name = "hub-watch"
path = "src/bin/hub_watch.rs"

[[bin]]
name = "hub-wave"
path = "src/bin/hub_wave.rs"

[[bin]]
name = "hub-thread"
path = "src/bin/hub_thread.rs"

[[bin]]
name = "hub-lock"
path = "src/bin/hub_lock.rs"

[[bin]]
name = "hub-stats"
path = "src/bin/hub_stats.rs"

[[bin]]
name = "hub-tui"
path = "src/bin/hub_tui.rs"
required-features = ["tui"]

[dependencies]
# `websockets`: remote clients join over wss:// (docs/JOIN_HUB.md).
async-nats = { version = "0.38", features = ["websockets"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
nkeys = "0.4"

# Binaries also need clap + tracing-subscriber (not needed by library consumers)
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]
